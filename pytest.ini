[pytest]
# Pytest 配置文件

# 测试发现路径
testpaths = tests

# 默认选项
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Python 文件模式
python_files = test_*.py

# Python 类模式
python_classes = Test*

# Python 函数模式
python_functions = test_*

# 标记定义
markers =
    slow: 标记为慢速测试（使用 -m "not slow" 跳过）
    mathematica_ref: 标记为参考 Mathematica 实现的测试
    requires_derivative: 标记为需要导数支持的测试
    requires_no: 标记为需要正规序支持的测试

# 最小 Python 版本
minversion = 6.0

# 控制台输出样式
console_output_style = progress

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告过滤
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# 覆盖率配置（如果使用 pytest-cov）
# [tool:pytest]
# addopts = --cov=pyope --cov-report=html --cov-report=term
